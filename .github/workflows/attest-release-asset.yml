name: attest-release-asset

# Attests a release asset this repository did not build.
#
# release.yml attests the core package, because CI builds it. The complete
# package - the one README calls "the one you want" - is assembled on the
# maintainer's machine, since CI does not fetch the neural runtime. It has
# therefore shipped with a .sha256 computed on that same machine and nothing
# else: a checksum proves the download arrived intact, and proves nothing at
# all about where it came from.
#
# This binds the published asset's digest to this repository through the
# workflow's OIDC identity, so `gh attestation verify` can answer "did this
# repository vouch for these exact bytes".
#
# Be clear about what that is and is not. It is NOT build provenance: no
# runner compiled this file, and the attestation cannot say one did. It is a
# signed statement, traceable to a run of this workflow on this repository,
# that this digest is the release asset. That is strictly more than a
# self-computed checksum and strictly less than release.yml gives the core
# package.
#
# The honest fix is for CI to build the complete package, which needs
# tools/fetch_neural_runtime.ps1 to run on a runner - a redistribution
# decision, not a CI one.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Tag of the published release, e.g. dlss5-video-player-v0.25.0'
        required: true
        type: string
      asset-name:
        description: 'Exact file name of the published release asset'
        required: true
        type: string
      asset-digest:
        description: 'Optional: the sha256 you expect, lowercase hex, no prefix. The job attests what it downloads either way; this only makes a mismatch fail the run.'
        required: false
        type: string
        default: ''

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write     # OIDC, for the signing identity
      attestations: write
      contents: read      # gh release download of a published release

    # Every input reaches the shell through env, never through ${{ }} inside a
    # script: an expression is pasted into the script text before bash parses
    # it, so a quote in an input was a way to run commands on the runner.
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      ASSET_NAME: ${{ inputs.asset-name }}
      EXPECTED_DIGEST: ${{ inputs.asset-digest }}

    steps:
      - name: Validate the inputs
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^dlss5-video-player-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release-tag must read dlss5-video-player-v<major.minor.patch>; got '$RELEASE_TAG'." >&2
            exit 1
          fi
          # No path separators and no glob characters: the name is handed to
          # gh as a download pattern and must match exactly one asset.
          if ! printf '%s' "$ASSET_NAME" | grep -Eq '^[A-Za-z0-9._-]+\.zip$'; then
            echo "asset-name must be the .zip as published; got '$ASSET_NAME'." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_DIGEST" ] && ! printf '%s' "$EXPECTED_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "asset-digest, when given, must be 64 lowercase hex characters." >&2
            exit 1
          fi

      # The job used to attest whatever digest the operator typed, so a typo
      # or a stale local file produced a valid signature over bytes nobody can
      # download. It now attests the bytes the release actually serves.
      - name: Download the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/asset"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/asset"
          if [ ! -f "$RUNNER_TEMP/asset/$ASSET_NAME" ] || [ "$(ls -A "$RUNNER_TEMP/asset" | wc -l)" -ne 1 ]; then
            echo "Release $RELEASE_TAG did not yield exactly the asset $ASSET_NAME." >&2
            exit 1
          fi

      - name: Compute the digest
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/asset/$ASSET_NAME" | cut -d' ' -f1)
          echo "Downloaded $ASSET_NAME from $RELEASE_TAG: sha256:$digest"
          if [ -n "$EXPECTED_DIGEST" ] && [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "The published asset is sha256:$digest, not the sha256:$EXPECTED_DIGEST given." >&2
            exit 1
          fi

      - name: Attest the published asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/asset/${{ inputs.asset-name }}

      - name: Explain what was attested
        run: |
          echo "Attested $ASSET_NAME as published on $RELEASE_TAG."
          echo "Verify with:"
          echo "  gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          echo
          echo "This records that this repository vouched for these bytes."
          echo "It does not record that a runner built them."
