name: release-windows

on:
  push:
    tags:
      - "dlss5-video-player-v*"

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require tag to match VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $expectedTag = "dlss5-video-player-v$version"
          $actualTag = $env:GITHUB_REF_NAME
          if ($actualTag -cne $expectedTag) {
            throw "Release tag '$actualTag' does not match VERSION '$version' (expected '$expectedTag')."
          }

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: |
          git init external\DLSS
          git -C external\DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external\DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external\DLSS checkout --detach FETCH_HEAD

      - name: Fetch pinned UI assets and media helpers
        shell: powershell
        run: |
          .\tools\fetch_ui_assets.ps1
          .\tools\fetch_youtube_helpers.ps1
          .\tools\fetch_ffmpeg_helpers.ps1

      - name: Configure
        shell: cmd
        run: cmake -S . -B build-upscaling -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        shell: cmd
        run: cmake --build build-upscaling --config Release --parallel

      - name: Test Release
        shell: cmd
        run: ctest --test-dir build-upscaling -C Release --output-on-failure

      - name: Assemble release package
        shell: cmd
        run: package_public_release.bat

      - name: Write core package checksum
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          if ($zip.Count -ne 1) {
            throw "Expected exactly one core package in dist, found $($zip.Count)."
          }
          $hash = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum -c only accepts '<hash>  <name>' with a bare LF, so the
          # file is written directly instead of through Set-Content, which
          # would append CRLF and make the line unreadable to coreutils.
          [System.IO.File]::WriteAllText("$($zip[0].FullName).sha256", "$hash  $($zip[0].Name)`n")

      - name: Build release notes
        shell: powershell
        run: |
          # The body was the generated commit list, which says what was committed
          # rather than what changed for someone installing it. The CHANGELOG
          # section is the other extreme - 470 lines for 0.22.0, which buries the
          # download. README's "What changed" paragraph for this version is the
          # short version the repository already maintains, so that is the body,
          # with the full section one link away.
          $version = (Get-Content -Raw VERSION).Trim()

          # The cut still has to have happened: a tag pushed while the section is
          # still called Unreleased is the mistake this catches.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))( |`$)" -Quiet)) {
            throw "CHANGELOG.md has no '## $version' section; cut it before tagging."
          }

          $lines = Get-Content -LiteralPath README.md
          $start = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^\*\*$([regex]::Escape($version))\*\* \(") { $start = $i; break }
          }
          if ($null -eq $start) {
            throw "README.md has no '**$version** (date)' entry under What changed; write it before tagging."
          }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\*\*[0-9]+\.[0-9]+\.[0-9]+\*\* \(') { $end = $i; break }
          }
          $summary = ($lines[$start..($end - 1)] -join "`n").TrimEnd()

          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          # Single quotes and -f: a here-string has to terminate at column 0,
          # which would break out of this YAML block scalar.
          $intro = @(
            'Windows x64, an RTX GPU and NVIDIA driver 610.47 or newer. Community project, not an',
            'NVIDIA product; the neural runtime is a modified, unsigned community build.',
            '',
            ('Download `dlss5-video-player-v{0}-win64.zip` below - player plus the pinned neural' -f $version),
            ('runtime. `DLSSVideoPlayer-v{0}-core-win64.zip` is the player alone, with no runtime' -f $version),
            'in it. Each has a `.sha256` beside it; GitHub''s "Source code" zip does not run.',
            ''
          )
          $tail = @(
            '',
            ('Every detail, including what was measured: [CHANGELOG.md for {0}](https://github.com/{1}/blob/{2}/CHANGELOG.md).' -f $version, $repo, $tag)
          )
          $body = (($intro + $summary + $tail) -join "`n")
          [System.IO.File]::WriteAllText("$PWD\release-notes.md", $body.TrimEnd() + "`n")
          Write-Host "Release notes: $($body.Length) characters from README's $version entry."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The body is README's short version for this release plus the download
          # lines; the generated commit list is appended under it by the action.
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
          # The packager names the zip after VERSION, which the tag gate above
          # already pinned; a missing file or checksum fails the release
          # instead of publishing an incomplete one. The complete package with
          # the neural runtime is attached by hand as
          # `dlss5-video-player-v<version>-win64.zip` - the name the README
          # promises - because CI never fetches that runtime.
          fail_on_unmatched_files: true
          files: |
            dist/DLSSVideoPlayer-v*-core-win64.zip
            dist/DLSSVideoPlayer-v*-core-win64.zip.sha256
