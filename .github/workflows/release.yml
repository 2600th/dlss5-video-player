name: release-windows

on:
  push:
    tags:
      - "dlss5-video-player-v*"
  # Retry a publish that failed after the tag was already pushed, without
  # re-pushing a public tag. The named tag is checked out and gated below
  # exactly as a pushed one is.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing dlss5-video-player-v<VERSION> tag to build and publish"
        required: true
        type: string

# Two runs for one tag would race on the same draft release; the later one
# waits rather than cancelling a publish in flight.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      # The provenance attestation of the core zip signs with the job's OIDC
      # token; no repository secret is involved.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require tag to match VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $expectedTag = "dlss5-video-player-v$version"
          $actualTag = $env:RELEASE_TAG
          if ($actualTag -cne $expectedTag) {
            throw "Release tag '$actualTag' does not match VERSION '$version' (expected '$expectedTag')."
          }

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: |
          git init external\DLSS
          git -C external\DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external\DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external\DLSS checkout --detach FETCH_HEAD

      - name: Fetch pinned UI assets and media helpers
        shell: powershell
        run: |
          .\tools\fetch_ui_assets.ps1
          .\tools\fetch_youtube_helpers.ps1
          .\tools\fetch_ffmpeg_helpers.ps1

      - name: Configure
        shell: cmd
        run: cmake -S . -B build-upscaling -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        shell: cmd
        run: cmake --build build-upscaling --config Release --parallel

      - name: Test Release
        shell: cmd
        run: ctest --test-dir build-upscaling -C Release -LE gpu --output-on-failure

      - name: Assemble the core package from the tested build
        shell: cmd
        run: package_public_release.bat

      - name: Write core package checksum
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          if ($zip.Count -ne 1) {
            throw "Expected exactly one core package in dist, found $($zip.Count)."
          }
          $hash = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum -c only accepts '<hash>  <name>' with a bare LF, so the
          # file is written directly instead of through Set-Content, which
          # would append CRLF and make the line unreadable to coreutils.
          [System.IO.File]::WriteAllText("$($zip[0].FullName).sha256", "$hash  $($zip[0].Name)`n")

      # Signed SLSA provenance for the core zip, verifiable with
      # `gh attestation verify <zip> --repo <owner>/<repo>`.
      - name: Attest core package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/DLSSVideoPlayer-v*-core-win64.zip

      # The body is README's short version for this release plus the download
      # lines; the same script gates pull requests that bump VERSION, so a
      # missing CHANGELOG section or README entry is found there, not here.
      - name: Build release notes
        shell: powershell
        run: .\tools\release_notes.ps1 -Repository $env:GITHUB_REPOSITORY

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # The generated commit list is appended under the body by the action.
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
          # A draft: the notes tell people to download the complete package
          # `dlss5-video-player-v<version>-win64.zip`, and CI never fetches the
          # neural runtime that goes into it, so the maintainer builds that zip
          # with package_release.bat, attaches it and its .sha256 to this draft,
          # and then publishes. Until then nothing is public.
          draft: true
          # The packager names the zip after VERSION, which the tag gate above
          # already pinned; a missing file or checksum fails the run instead of
          # leaving a draft without its core package.
          fail_on_unmatched_files: true
          files: |
            dist/DLSSVideoPlayer-v*-core-win64.zip
            dist/DLSSVideoPlayer-v*-core-win64.zip.sha256
