name: release-windows

on:
  push:
    tags:
      - "dlss5-video-player-v*"

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require tag to match VERSION
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $expectedTag = "dlss5-video-player-v$version"
          $actualTag = $env:GITHUB_REF_NAME
          if ($actualTag -cne $expectedTag) {
            throw "Release tag '$actualTag' does not match VERSION '$version' (expected '$expectedTag')."
          }

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: |
          git init external\DLSS
          git -C external\DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external\DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external\DLSS checkout --detach FETCH_HEAD

      - name: Fetch pinned UI assets and media helpers
        shell: powershell
        run: |
          .\tools\fetch_ui_assets.ps1
          .\tools\fetch_youtube_helpers.ps1
          .\tools\fetch_ffmpeg_helpers.ps1

      - name: Configure
        shell: cmd
        run: cmake -S . -B build-upscaling -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        shell: cmd
        run: cmake --build build-upscaling --config Release --parallel

      - name: Test Release
        shell: cmd
        run: ctest --test-dir build-upscaling -C Release --output-on-failure

      - name: Assemble release package
        shell: cmd
        run: package_public_release.bat

      - name: Write core package checksum
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          if ($zip.Count -ne 1) {
            throw "Expected exactly one core package in dist, found $($zip.Count)."
          }
          $hash = (Get-FileHash -LiteralPath $zip[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum -c only accepts '<hash>  <name>' with a bare LF, so the
          # file is written directly instead of through Set-Content, which
          # would append CRLF and make the line unreadable to coreutils.
          [System.IO.File]::WriteAllText("$($zip[0].FullName).sha256", "$hash  $($zip[0].Name)`n")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          # The packager names the zip after VERSION, which the tag gate above
          # already pinned; a missing file or checksum fails the release
          # instead of publishing an incomplete one. The full package with the
          # neural runtime is attached by hand, since CI never fetches that
          # runtime.
          fail_on_unmatched_files: true
          files: |
            dist/DLSSVideoPlayer-v*-core-win64.zip
            dist/DLSSVideoPlayer-v*-core-win64.zip.sha256
