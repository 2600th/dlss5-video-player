name: release-windows

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: git clone --depth 1 https://github.com/NVIDIA/DLSS.git external\DLSS

      - name: Download FFmpeg Essentials
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force external\ffmpeg\bin | Out-Null
          Invoke-WebRequest -UseBasicParsing https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile external\ffmpeg.zip
          Expand-Archive external\ffmpeg.zip external\ffmpeg_unpack -Force
          $ffmpeg = Get-ChildItem external\ffmpeg_unpack -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem external\ffmpeg_unpack -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName external\ffmpeg\bin\ffmpeg.exe
          Copy-Item $ffprobe.FullName external\ffmpeg\bin\ffprobe.exe

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Assemble release package
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "dist/DLSSVideoPlayer-$tag-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/Release/DLSSVideoPlayer.exe $stage/
          Copy-Item external/ffmpeg/bin/ffmpeg.exe $stage/
          Copy-Item external/ffmpeg/bin/ffprobe.exe $stage/
          Copy-Item external/DLSS/lib/Windows_x86_64/rel/nvngx_dlss.dll $stage/
          Copy-Item languages $stage/languages -Recurse
          Copy-Item docs $stage/docs -Recurse
          Copy-Item README.md,LICENSE,THIRD_PARTY.md,CHANGELOG.md,DLSS5_CHECKLIST.txt,prepare_dlss5_test.bat,inspect_dlssnr.ps1,run_dlss5_test.bat,run_4k_auto.bat,run_4k_quality.bat $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/DLSSVideoPlayer-$tag-win64.zip" -CompressionLevel Optimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
