name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; each job states the same again so a
# job added later starts from nothing rather than inheriting a grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # Several times a clean run; the 6-hour default only hides a hang.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # No job pushes, so none keeps the token in .git/config where every later
      # step - and every script it runs - could read it. The one fetch below is
      # of this public repository and needs no credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require CHANGELOG and README entries when VERSION changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The two guards the release notes throw on, run on the pull request
          # that bumps VERSION so the mistake is found before the tag is pushed.
          git fetch --depth 1 origin "$BASE_SHA"
          base=$(git show "$BASE_SHA:VERSION" | tr -d '[:space:]')
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$base" = "$version" ]; then
            echo "VERSION is $version on both sides; no release entries are required."
            exit 0
          fi
          echo "VERSION changes from $base to $version; the release notes must build from this tree."
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release_notes.ps1 -Repository "$GITHUB_REPOSITORY" -OutFile "$RUNNER_TEMP/release-notes.md"

      - name: Build dependencies
        uses: ./.github/actions/build-deps

      # The quick configuration (CMakePresets.json `ci`): the shipped targets
      # and the device-free suites, without the GPU and audio smokes this
      # runner cannot start and without link-time code generation, which
      # re-optimised the whole player once per test executable. The nightly
      # workflow and every release build the shipping configuration and run
      # every device-free suite.
      - name: Configure
        shell: cmd
        run: cmake --preset ci

      - name: Build Release
        shell: cmd
        run: cmake --build --preset ci --parallel

      # The quick tier: every device-free suite except the `slow` label
      # (PolicyTestsSlow, CachedExportTests), which nightly.yml and
      # release.yml run.
      - name: Test Release
        shell: cmd
        run: ctest --preset quick

      # Symbols for the minidumps CrashDump.h writes from both processes. The
      # PDBs never enter a zip (the packager copies an explicit list and the
      # verifier's allowlist refuses anything else); they are kept here, with
      # the executables they match, so a dump from this build can be symbolised.
      - name: Upload symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ github.sha }}
          path: |
            build-ci/Release/DLSSVideoPlayer.exe
            build-ci/Release/DLSSVideoPlayer.pdb
            build-ci/Release/neural-runtime/NeuralWorker.exe
            build-ci/Release/neural-runtime/NeuralWorker.pdb
          if-no-files-found: error

      # The same packager the release workflow runs, on the build ctest just
      # ran, so a packaging break is found on the pull request and not on the
      # tag. -Snapshot: this commit is not the release tag, so the packager
      # checks only that the tree is clean (tools/source_identity.ps1).
      - name: Assemble the core package from the tested build
        shell: cmd
        run: package_public_release.bat -Snapshot -BuildDirectory build-ci

      - name: Verify the core package
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          if ($zip.Count -ne 1) {
            throw "Expected exactly one core package in dist, found $($zip.Count)."
          }
          .\tools\verify_package.ps1 -Zip $zip[0].FullName -PublicCore

      # The check README gives users, run the way they run it: the copy inside
      # the zip, from the unpacked folder, with no repository around it. The
      # packaged script used to read VERSION from its parent directory and so
      # failed on every download before checking anything, while the repository
      # copy above kept passing.
      - name: Verify the core package as a user would
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked-core'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unpacked
          $folder = Join-Path $unpacked ([IO.Path]::GetFileNameWithoutExtension($zip[0].Name))
          Push-Location -LiteralPath $folder
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\verify_package.ps1
            if ($LASTEXITCODE -ne 0) { throw "The packaged verify_package.ps1 exited $LASTEXITCODE." }
          }
          finally { Pop-Location }

      # Uploaded as the file itself, not re-zipped, so what is downloaded is the
      # verified package under its own name and runs as-is.
      - name: Upload core package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/DLSSVideoPlayer-v*-core-win64.zip
          archive: false
          if-no-files-found: error
