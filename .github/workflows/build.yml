name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; each job states the same again so a
# job added later starts from nothing rather than inheriting a grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # Several times a clean run; the 6-hour default only hides a hang.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      # No job pushes, so none keeps the token in .git/config where every later
      # step - and every script it runs - could read it. The one fetch below is
      # of this public repository and needs no credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require CHANGELOG and README entries when VERSION changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The two guards the release notes throw on, run on the pull request
          # that bumps VERSION so the mistake is found before the tag is pushed.
          git fetch --depth 1 origin "$BASE_SHA"
          base=$(git show "$BASE_SHA:VERSION" | tr -d '[:space:]')
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$base" = "$version" ]; then
            echo "VERSION is $version on both sides; no release entries are required."
            exit 0
          fi
          echo "VERSION changes from $base to $version; the release notes must build from this tree."
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release_notes.ps1 -Repository "$GITHUB_REPOSITORY" -OutFile "$RUNNER_TEMP/release-notes.md"

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: |
          git init external\DLSS
          git -C external\DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external\DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external\DLSS checkout --detach FETCH_HEAD

      # FFmpeg, FFprobe, yt-dlp and Deno are the bulk of every run's downloads.
      # The key is the lock that pins their bytes, and a restored copy is held
      # to that lock below exactly as a fresh download would be.
      - name: Restore the pinned media helpers
        id: helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            external/ffmpeg/bin
            external/youtube/yt-dlp.exe
            external/youtube/deno.exe
          key: pinned-helpers-${{ runner.os }}-${{ hashFiles('packaging/tool-lock.json') }}

      - name: Fetch pinned UI assets
        shell: powershell
        run: .\tools\fetch_ui_assets.ps1

      - name: Fetch pinned media helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          .\tools\fetch_youtube_helpers.ps1
          .\tools\fetch_ffmpeg_helpers.ps1

      - name: Check the restored media helpers against the lock
        if: steps.helpers.outputs.cache-hit == 'true'
        shell: powershell
        run: |
          $lock = Get-Content -LiteralPath packaging\tool-lock.json -Raw | ConvertFrom-Json
          foreach ($entry in $lock.entries) {
            $folder = if ([string]$entry.name -in @('ffmpeg.exe', 'ffprobe.exe')) { 'external\ffmpeg\bin' } else { 'external\youtube' }
            $path = Join-Path $folder ([string]$entry.name)
            if ((Get-Item -LiteralPath $path).Length -ne [int64]$entry.size -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -cne [string]$entry.sha256) {
              throw "The cached $($entry.name) does not match packaging/tool-lock.json."
            }
          }
          Write-Host "Restored media helpers match the lock."

      # CMakePresets.json pins the generator, the platform and the MSVC toolset.
      - name: Configure
        shell: cmd
        run: cmake --preset vs2022

      - name: Build Release
        shell: cmd
        run: cmake --build --preset vs2022 --parallel

      - name: Test Release
        shell: cmd
        run: ctest --preset portable

      # Symbols for the minidumps CrashDump.h writes from both processes. The
      # PDBs never enter a zip (the packager copies an explicit list and the
      # verifier's allowlist refuses anything else); they are kept here, with
      # the executables they match, so a dump from this build can be symbolised.
      - name: Upload symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ github.sha }}
          path: |
            build-upscaling/Release/DLSSVideoPlayer.exe
            build-upscaling/Release/DLSSVideoPlayer.pdb
            build-upscaling/Release/neural-runtime/NeuralWorker.exe
            build-upscaling/Release/neural-runtime/NeuralWorker.pdb
          if-no-files-found: error

      # The same packager the release workflow runs, on the build ctest just
      # ran, so a packaging break is found on the pull request and not on the
      # tag.
      - name: Assemble the core package from the tested build
        shell: cmd
        run: package_public_release.bat

      - name: Verify the core package
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          if ($zip.Count -ne 1) {
            throw "Expected exactly one core package in dist, found $($zip.Count)."
          }
          .\tools\verify_package.ps1 -Zip $zip[0].FullName -PublicCore

      # The check README gives users, run the way they run it: the copy inside
      # the zip, from the unpacked folder, with no repository around it. The
      # packaged script used to read VERSION from its parent directory and so
      # failed on every download before checking anything, while the repository
      # copy above kept passing.
      - name: Verify the core package as a user would
        shell: powershell
        run: |
          $zip = @(Get-ChildItem -LiteralPath dist -Filter 'DLSSVideoPlayer-v*-core-win64.zip' -File)
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked-core'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unpacked
          $folder = Join-Path $unpacked ([IO.Path]::GetFileNameWithoutExtension($zip[0].Name))
          Push-Location -LiteralPath $folder
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\verify_package.ps1
            if ($LASTEXITCODE -ne 0) { throw "The packaged verify_package.ps1 exited $LASTEXITCODE." }
          }
          finally { Pop-Location }

      # Uploaded as the file itself, not re-zipped, so what is downloaded is the
      # verified package under its own name and runs as-is.
      - name: Upload core package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/DLSSVideoPlayer-v*-core-win64.zip
          archive: false
          if-no-files-found: error

  # Two configurations nothing ships: the MSVC code analyzer over the two
  # shipped targets, and AddressSanitizer over every device-free suite. Both
  # compile under /WX, so an analyzer finding or a sanitizer report fails the
  # run. A separate job, so its extra builds do not lengthen the one above.
  quality:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone NVIDIA DLSS SDK
        shell: cmd
        run: |
          git init external\DLSS
          git -C external\DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external\DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external\DLSS checkout --detach FETCH_HEAD

      - name: Restore the pinned media helpers
        id: helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            external/ffmpeg/bin
            external/youtube/yt-dlp.exe
            external/youtube/deno.exe
          key: pinned-helpers-${{ runner.os }}-${{ hashFiles('packaging/tool-lock.json') }}

      - name: Fetch pinned UI assets
        shell: powershell
        run: .\tools\fetch_ui_assets.ps1

      - name: Fetch pinned media helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          .\tools\fetch_youtube_helpers.ps1
          .\tools\fetch_ffmpeg_helpers.ps1

      - name: Check the restored media helpers against the lock
        if: steps.helpers.outputs.cache-hit == 'true'
        shell: powershell
        run: |
          $lock = Get-Content -LiteralPath packaging\tool-lock.json -Raw | ConvertFrom-Json
          foreach ($entry in $lock.entries) {
            $folder = if ([string]$entry.name -in @('ffmpeg.exe', 'ffprobe.exe')) { 'external\ffmpeg\bin' } else { 'external\youtube' }
            $path = Join-Path $folder ([string]$entry.name)
            if ((Get-Item -LiteralPath $path).Length -ne [int64]$entry.size -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -cne [string]$entry.sha256) {
              throw "The cached $($entry.name) does not match packaging/tool-lock.json."
            }
          }
          Write-Host "Restored media helpers match the lock."

      - name: Code analysis of the shipped targets
        shell: cmd
        run: |
          cmake --preset analyze
          if errorlevel 1 exit /b 1
          cmake --build --preset analyze --parallel

      - name: Build the device-free suites with AddressSanitizer
        shell: cmd
        run: |
          cmake --preset asan
          if errorlevel 1 exit /b 1
          cmake --build --preset asan --parallel

      - name: Run the device-free suites under AddressSanitizer
        shell: cmd
        run: ctest --preset asan
