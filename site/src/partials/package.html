<article class="{{PKG_CLASS}}">
  <h3 class="pkg__kind">{{PKG_KIND}}</h3>
  <p class="pkg__summary">{{PKG_SUMMARY}}</p>
  <a class="pkg__cta" href="{{PKG_URL}}" data-download="{{PKG_EVENT}}">
    <span class="pkg__cta-label">{{PKG_CTA}}</span>
    <span class="pkg__cta-size">{{PKG_SIZE}}</span>
  </a>
  <p class="pkg__file">{{PKG_NAME}}</p>
  {{PKG_CHECKSUM}}
</article>
